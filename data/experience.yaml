items:
- title: 组织委员 <span class="exp-org">· 重庆大学</span>
  date: 现任
  bullets_html:
  - 负责<span class="hl">班级日志小程序的日常维护</span>。
- title: 班级临时负责人 <span class="exp-org">· 重庆大学</span>
  date: 开学与军训期间
  bullets_html:
  - 开学与军训期间当班级临时负责人，通知传达、材料收集、考勤纪律一件件跟到位，<span class="hl">做事认真不糊弄</span>。
  - 碰到流程上的卡点会主动想改良办法：把通知整理成固定模板、用表格统一收集信息，<span class="deco-anchor wave-anchor">让重复的事省事</span>。
- title: 生活委员 &amp; 数学课代表 <span class="exp-org">· 高中</span>
  date: 高中部分时间
  bullets_html:
  - 当生活委员，管宿舍卫生检查和班级活动的物资、场地，<span class="hl">同学有需要的事尽量帮忙处理好</span>。
  - 兼数学课代表，收作业、发试卷，把同学的问题整理好交给老师。
  - 组织过节日联欢、生日会，从定方案到布置现场全程跟进。
  - 学校年级的通知由我转达，保证不漏人、不传错。
- title: 班长 &amp; 学生会干部 <span class="exp-org">· 初中</span>
  date: 初中阶段
  bullets_html:
  - 初中做班长，班级纪律、卫生、考勤和活动都跟着盯，<span class="hl">班里的事有人兜着</span>。
  - 同时是学生会干部，参与组织校园活动和日常检查评比，学会了跟不同年级的同学对接。
  - 老师的要求、同学的意见常由我在中间传，<span class="deco-anchor wave-anchor">把话说清楚</span>。
