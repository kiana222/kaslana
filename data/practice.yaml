  description_html: 高中多次参加校园科技周，做过悬浮原理探究、月球小车等项目。暑假自学 Codex、Obsidian、WorkBuddy 等学习工具，借助 AI 搭建了多个网站，并<span class="hl">做出第一款小游戏和第一支视频</span>；平时也用工具辅助处理数据、整理文档和制作 PPT。<br>还常按班里的实际需要动手做小工具，<span class="hl">做了一个班级日志小程序</span>，日常记录和交接都省事不少。
